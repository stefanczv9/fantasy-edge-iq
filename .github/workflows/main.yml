name: Update fantasy dashboards

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main.yml"
  schedule:
    # GitHub cron is UTC.
    # After-match refresh window for EuroLeague game nights in Europe/Zagreb.
    - cron: "55 18,19,20,21,22,23 * * 2-5"
    # Backup runs for late API updates after the round/game-night.
    - cron: "20 0,2,5 * * *"

permissions:
  contents: write

concurrency:
  group: update-fantasy-dashboards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check required files
        shell: bash
        run: |
          set -e
          test -f requirements.txt
          test -f package.json
          test -f scripts/run_euroleague_auto_refresh.py
          test -f data/fantasy_profiles_active.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync latest branch before generating
        shell: bash
        run: |
          git pull --ff-only origin "${GITHUB_REF_NAME:-main}"

      - name: Refresh EuroLeague dashboard, Projected PIR and real-points DvP
        run: python scripts/run_euroleague_auto_refresh.py

      - name: Build static site routes
        run: npm run build

      - name: Show changed files
        run: git status --short

      - name: Commit and push refreshed files
        shell: bash
        run: |
          set -e
          BRANCH="${GITHUB_REF_NAME:-main}"

          git config user.name "fantasy-edge-iq-bot"
          git config user.email "actions@github.com"

          add_if_exists() {
            if [ -e "$1" ]; then
              git add "$1"
            fi
          }

          add_if_exists BUILD_VERSION.txt
          add_if_exists data/fantasy_profiles_active.json
          add_if_exists euroleague-dashboard.html
          add_if_exists sr-euroleague-dashboard.html
          add_if_exists el-euroleague-dashboard.html
          add_if_exists euroleague-team-analyzer.html
          add_if_exists euroleague-defense-vs-position.html
          add_if_exists sr-euroleague-defense-vs-position.html
          add_if_exists el-euroleague-defense-vs-position.html
          add_if_exists euroleague-players-full.csv
          add_if_exists euroleague-team-context.csv
          add_if_exists euroleague-next5-schedule.csv
          add_if_exists euroleague-defense-vs-position.csv
          add_if_exists euroleague-defense-vs-position-matchlog.csv
          add_if_exists public/BUILD_VERSION.txt
          add_if_exists public/euroleague/index.html
          add_if_exists public/euroleague/dashboard/index.html
          add_if_exists public/euroleague/team-analyzer/index.html
          add_if_exists public/euroleague/defense-vs-position/index.html
          add_if_exists public/sr/euroleague/dashboard/index.html
          add_if_exists public/sr/euroleague/defense-vs-position/index.html
          add_if_exists public/el/euroleague/dashboard/index.html
          add_if_exists public/el/euroleague/defense-vs-position/index.html
          add_if_exists public/euroleague-players-full.csv
          add_if_exists public/euroleague-team-context.csv
          add_if_exists public/euroleague-next5-schedule.csv
          add_if_exists public/euroleague-defense-vs-position.csv
          add_if_exists public/euroleague-defense-vs-position-matchlog.csv

          if git diff --cached --quiet; then
            echo "No EuroLeague changes to commit."
            exit 0
          fi

          git commit -m "Automated fantasy data refresh [skip ci]"

          # Push conflict protection: if another commit landed while this workflow was running,
          # rebase this generated refresh on top of latest main and retry.
          for attempt in 1 2 3; do
            echo "Push attempt $attempt"
            git fetch origin "$BRANCH"
            git rebase -X theirs "origin/$BRANCH"
            if git push origin "HEAD:$BRANCH"; then
              echo "Push successful."
              exit 0
            fi
            echo "Push failed, retrying after syncing latest branch..."
            sleep 5
          done

          echo "Push failed after 3 attempts."
          exit 1

      - name: Optional Vercel deploy hook
        shell: bash
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          else
            echo "No VERCEL_DEPLOY_HOOK_URL secret set; relying on Vercel GitHub auto-deploy."
          fi
