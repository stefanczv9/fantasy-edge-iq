name: Update fantasy dashboards

on:
  workflow_dispatch:
  schedule:
    - cron: "55 18,19,20,21,22,23 * * 2-5"
    - cron: "20 0,2,5 * * *"

permissions:
  contents: write

concurrency:
  group: update-fantasy-dashboards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test Vercel static build
        run: npm run build

      - name: Commit refreshed data and pages
        shell: bash
        run: |
          set -e
          git config user.name "actions-user"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Automated fantasy data refresh"
          git pull --rebase origin main
          git push origin HEAD:main
