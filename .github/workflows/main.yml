name: Update fantasy dashboards

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Runs after EuroLeague game-night finishes and again as backup.
    - cron: "55 18,19,20,21,22,23 * * 2-5"
    - cron: "20 0,2,5 * * *"

permissions:
  contents: write

concurrency:
  group: update-fantasy-dashboards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp requests pandas numpy rapidfuzz openpyxl xlsxwriter euroleague-api pillow

      - name: Sync latest branch before generating
        shell: bash
        run: git pull --ff-only origin "${GITHUB_REF_NAME:-main}"

      - name: Refresh EuroLeague dashboard, Projected PIR and real-points DvP
        run: python scripts/run_euroleague_auto_refresh.py

      - name: Build static site routes
        run: npm run build

      - name: Show changed files
        run: git status --short

      - name: Commit and push refreshed files
        shell: bash
        run: |
          set -e
          BRANCH="${GITHUB_REF_NAME:-main}"
          git config user.name "fantasy-edge-iq-bot"
          git config user.email "actions@github.com"

          git add BUILD_VERSION.txt || true
          git add data/fantasy_profiles_active.json || true
          git add scripts/*.py || true
          git add euroleague-dashboard.html sr-euroleague-dashboard.html el-euroleague-dashboard.html || true
          git add euroleague-team-analyzer.html || true
          git add euroleague-defense-vs-position.html sr-euroleague-defense-vs-position.html el-euroleague-defense-vs-position.html || true
          git add euroleague-players-full.csv euroleague-team-context.csv euroleague-next5-schedule.csv || true
          git add euroleague-defense-vs-position.csv euroleague-defense-vs-position-matchlog.csv || true
          git add public/BUILD_VERSION.txt || true
          git add public/euroleague/index.html public/euroleague/dashboard/index.html public/euroleague/team-analyzer/index.html public/euroleague/defense-vs-position/index.html || true
          git add public/sr/euroleague/dashboard/index.html public/sr/euroleague/defense-vs-position/index.html || true
          git add public/el/euroleague/dashboard/index.html public/el/euroleague/defense-vs-position/index.html || true
          git add public/euroleague-players-full.csv public/euroleague-team-context.csv public/euroleague-next5-schedule.csv || true
          git add public/euroleague-defense-vs-position.csv public/euroleague-defense-vs-position-matchlog.csv || true

          if git diff --cached --quiet; then
            echo "No EuroLeague changes to commit."
            exit 0
          fi

          git commit -m "Automated fantasy data refresh [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase -X theirs "origin/$BRANCH"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Optional Vercel deploy hook
        shell: bash
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          else
            echo "No VERCEL_DEPLOY_HOOK_URL secret set; relying on Vercel GitHub auto-deploy."
          fi
