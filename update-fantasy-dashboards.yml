name: Update fantasy dashboards manual backup

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fantasy-dashboards-manual
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: git pull --ff-only origin "${GITHUB_REF_NAME}"
      - run: python scripts/run_euroleague_auto_refresh.py
      - run: npm run build
      - name: Commit and push
        shell: bash
        run: |
          set -e
          git config user.name "fantasy-edge-iq-bot"
          git config user.email "actions@github.com"
          git add BUILD_VERSION.txt data/fantasy_profiles_active.json euroleague-dashboard.html sr-euroleague-dashboard.html el-euroleague-dashboard.html euroleague-team-analyzer.html euroleague-defense-vs-position.html sr-euroleague-defense-vs-position.html el-euroleague-defense-vs-position.html euroleague-players-full.csv euroleague-team-context.csv euroleague-next5-schedule.csv euroleague-defense-vs-position.csv euroleague-defense-vs-position-matchlog.csv public/BUILD_VERSION.txt public/euroleague/index.html public/euroleague/dashboard/index.html public/euroleague/team-analyzer/index.html public/euroleague/defense-vs-position/index.html public/sr/euroleague/dashboard/index.html public/sr/euroleague/defense-vs-position/index.html public/el/euroleague/dashboard/index.html public/el/euroleague/defense-vs-position/index.html public/euroleague-players-full.csv public/euroleague-team-context.csv public/euroleague-next5-schedule.csv public/euroleague-defense-vs-position.csv public/euroleague-defense-vs-position-matchlog.csv
          if git diff --cached --quiet; then echo "No EuroLeague changes to commit."; exit 0; fi
          git commit -m "Manual refresh EuroLeague dashboard and DvP"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push
